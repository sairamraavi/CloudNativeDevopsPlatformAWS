kind: DaemonSet
fullnameOverride: fluent-bit

serviceAccount:
  create: true
  name: fluent-bit
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::175200623108:role/streamingapp-capstone-dev-application-logs

rbac:
  create: true

nodeSelector:
  kubernetes.io/os: linux

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

daemonSetVolumes:
  - name: varlog
    hostPath:
      path: /var/log
      type: Directory
  - name: checkpoints
    hostPath:
      path: /var/lib/capstone-fluent-bit
      type: DirectoryOrCreate

daemonSetVolumeMounts:
  - name: varlog
    mountPath: /var/log
    readOnly: true
  - name: checkpoints
    mountPath: /var/lib/fluent-bit

config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
        storage.path /var/lib/fluent-bit/buffer
        storage.sync normal
        storage.checksum on
        storage.backlog.mem_limit 10M

  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*_streaming-app-dev_*.log
        Tag kube.*
        multiline.parser docker, cri
        DB /var/lib/fluent-bit/application.db
        Read_from_Head Off
        Refresh_Interval 5
        Rotate_Wait 30
        Mem_Buf_Limit 10MB
        Skip_Long_Lines On
        storage.type filesystem

  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log Off
        Labels Off
        Annotations Off

  outputs: |
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region ap-south-1
        log_group_name /streamingapp-capstone/dev/application
        log_stream_prefix application-
        auto_create_group Off
        Retry_Limit False
        storage.total_limit_size 100M