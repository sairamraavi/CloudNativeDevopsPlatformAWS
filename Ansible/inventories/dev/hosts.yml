---
all:
  children:
    jenkins:
      hosts:
        jenkins_dev:
          ansible_host: "{{ lookup('ansible.builtin.env', 'CAPSTONE_JENKINS_IP') }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/streamingapp-capstone-jenkins"
          ansible_python_interpreter: /usr/bin/python3