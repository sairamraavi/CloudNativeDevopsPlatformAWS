
---
- name: Require an explicitly selected Helm version
  ansible.builtin.assert:
    that:
      - helm_version | length > 0
      - helm_version is match('^v[0-9]+\\.[0-9]+\\.[0-9]+$')
    fail_msg: >-
      Set helm_version to the version approved by the capstone team,
      for example v3.x.y, before running this role.

- name: Check whether Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_binary

- name: Download Helm installation script
  ansible.builtin.get_url:
    url: "{{ helm_install_script_url }}"
    dest: "{{ helm_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: not helm_binary.stat.exists

- name: Install pinned Helm version
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ helm_install_script_path }}"
  environment:
    DESIRED_VERSION: "{{ helm_version }}"
  when: not helm_binary.stat.exists
  changed_when: true

- name: Verify Helm installation
  ansible.builtin.command:
    argv:
      - /usr/local/bin/helm
      - version
      - --short
  changed_when: false
