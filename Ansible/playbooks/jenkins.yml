---
- name: Configure Jenkins CI/CD controller
  hosts: jenkins
  become: true
  gather_facts: true

  roles:
    - common
    - java
    - jenkins
    - docker
    - awscli
    - kubectl
    - terraform
    - helm
    - role: nginx
      tags:
        - nginx
    - role: cloudwatch_agent
      tags:
        - cloudwatch_agent
    - role: cloudflared
      tags:
        - cloudflared