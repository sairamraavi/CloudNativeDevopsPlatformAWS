apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.secretReader.serviceAccountName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "Provide secretReader.roleArn" .Values.secretReader.roleArn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: streamingapp-aws-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.secretReader.serviceAccountName | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamingapp-application
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    name: streamingapp-aws-secrets
    kind: SecretStore
  target:
    name: {{ .Values.targetSecretName | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MONGO_URI
      remoteRef:
        key: {{ .Values.remoteSecretName | quote }}
        property: MONGO_URI
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.remoteSecretName | quote }}
        property: JWT_SECRET