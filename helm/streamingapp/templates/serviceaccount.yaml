{{- if .Values.serviceAccounts.create }}
{{- range $service := list "auth" "streaming" "admin" "chat" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index $.Values.serviceAccounts $service }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: streamingapp
    app.kubernetes.io/component: {{ $service }}
    app.kubernetes.io/managed-by: Helm
{{- end }}
{{- end }}