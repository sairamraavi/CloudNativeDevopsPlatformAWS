image:
  registry: ""
  tag: ""
  pullPolicy: IfNotPresent

serviceAccounts:
  create: true
  auth: streamingapp-auth
  streaming: streamingapp-streaming-s3
  admin: streamingapp-admin-s3
  chat: streamingapp-chat

storageClass:
  create: true
  name: streamingapp-gp3
  default: false

frontend:
  repository: ""
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

services:
  auth:
    repository: ""
    port: 3001
    healthPath: /health
  streaming:
    repository: ""
    port: 3002
    healthPath: /api/health
  admin:
    repository: ""
    port: 3003
    healthPath: /api/health
  chat:
    repository: ""
    port: 3004
    healthPath: /api/health

mongodb:
  image: mongo:6
  port: 27017
  storageSize: 1Gi
  storageClassName: streamingapp-gp3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

app:
  mongoUri: mongodb://mongodb:27017/streamingapp
  secretName: streamingapp-secrets
  clientUrls: ""
  streamingPublicUrl: ""
  awsRegion: ""
  s3Bucket: ""

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    enabled: false
    secretName: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
