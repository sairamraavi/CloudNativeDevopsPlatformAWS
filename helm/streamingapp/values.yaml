image:
  registry: 175200623108.dkr.ecr.ap-south-1.amazonaws.com
  tag: 05b5902e19e7-20261023204946
  pullPolicy: IfNotPresent

frontend:
  repository: streamingapp-capstone-frontend
  tag: 2f7c5a31fc31-20261023213813
  replicas: 1
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

services:
  auth:
    repository: streamingapp-capstone-auth
    serviceAccountName: streamingapp-auth
    roleArn: ""
    port: 3001
    healthPath: /health
  streaming:
    repository: streamingapp-capstone-streaming
    serviceAccountName: streamingapp-streaming
    roleArn: ""
    port: 3002
    healthPath: /api/health
  admin:
    repository: streamingapp-capstone-admin
    serviceAccountName: streamingapp-admin
    roleArn: ""
    port: 3003
    healthPath: /api/health
  chat:
    repository: streamingapp-capstone-chat
    serviceAccountName: streamingapp-chat
    roleArn: ""
    port: 3004
    healthPath: /api/health

mongodb:
  enabled: false
  image: mongo:6
  port: 27017
  storageSize: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

app:
  secretName: streamingapp-application
  clientUrls: https://streaming.sairamraavi.com
  streamingPublicUrl: https://streaming.sairamraavi.com
  awsRegion: ap-south-1
  s3Bucket: streamingapp-media-5ec46eb6f6a44d20df3a94ae11

ingress:
  enabled: false
  className: alb
  host: streaming.sairamraavi.com
  certificateArn: ""

autoscaling:
  enabled: true
  workloads:
    - auth
    - streaming
    - admin
    - frontend
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70